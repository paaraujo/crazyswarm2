# named list of all robots
fileversion: 3

# named list of all robots
robots:
  # Crazyflies brushless
  C23:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E717
    initial_position: [0.0, 0.0, 0.0]
    type: C10X # see robot_types
    # role: evader
    firmware_params:
      tdoa3:
        hmId: 252
        hmLId3: 254      # leader
        hmLId4: 253      # follower
      kalman:
        initialZ: 0.60           # <-- measured height of THIS tripod
  C24:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E718
    initial_position: [0.0, 0.0, 0.0]
    type: C10X # see robot_types
    # role: pursuer
    firmware_params:
      tdoa3:
        hmId: 254
        hmLId3: 253      # leader
        hmLId4: 252      # follower
      kalman:
        initialZ: 0.60           # <-- measured height of THIS tripod
  C25:
    enabled: true
    uri: radio://0/80/2M/E7E7E7E719
    initial_position: [0.0, 0.0, 0.0]
    type: C10X # see robot_types
    # role: pursuer
    firmware_params:
      tdoa3:
        hmId: 253
        hmLId3: 252      # leader
        hmLId4: 254      # follower
      kalman:
        initialZ: 0.60           # <-- measured height of THIS tripod

# Definition of the various robot types
robot_types:
  C10X:
    motion_capture:
      enabled: false  # IMPORTANT: we are using the UWB sensors for localization
      # only if enabled; see motion_capture.yaml
      marker: C10X
      dynamics: default
    big_quad: false
    battery:
      # voltage_warning: 3.8  # V
      # voltage_critical: 3.7 # V
      voltage_warning: 3.4  # V
      voltage_critical: 3.2 # V
    # firmware_params:
    #   kalman:
    #     pNAcc_xy: 1.0 # default 0.5
    #firmware_logging:
    #   enabled: true
    #   default_topics:
    #   pose:
    #     frequency: 1 # Hz
    #   custom_topics:
    #    topic_name3: 
    #      frequency: 1
    #      vars: ["acc.x", "acc.y", "acc.z"]

# global settings for all robots
all:
  # firmware logging for all drones (use robot_types/type_name to set per type, or
  # robots/drone_name to set per drone)
  firmware_logging:
    enabled: true
    default_topics:
      # remove to disable default topic
      pose:
        frequency: 10 # Hz
      status:
        frequency: 1  # Hz
      # odom:
      #   frequency: 1

    custom_topics:
      # State vector, SI. Order is the EKF's own: th, dk, dj, we, r, dz.
      # swarm_cov below uses the SAME order so values[i] pairs with values[i].
      swarm_state:
        frequency: 10
        vars: ["swarmFilter.th", "swarmFilter.dk", "swarmFilter.dj",
               "swarmFilter.we", "swarmFilter.r", "swarmFilter.dz",
               "swarmFilter.seq"] 

      # Variances [rad^2 / (rad/s)^2 / m^2], SAME ORDER as swarm_state.
      swarm_cov:
        frequency: 10
        vars: ["swarmCov.th", "swarmCov.dk", "swarmCov.dj",
               "swarmCov.we", "swarmCov.r", "swarmCov.dz",
               "swarmCov.seq"] 

      # Separations the controller regulates [rad], and its output.
      swarm_ctrl:
        frequency: 10
        vars: ["swarmFilter.phiK", "swarmFilter.phiJ",
               "swarmCtrl.ePhi", "swarmCtrl.eR",
               "swarmCtrl.vx", "swarmCtrl.vy"]

      # Engagement state and refusal reason. Separate because these are
      # integers and belong at a lower rate.
      swarm_eng:
        frequency: 2
        vars: ["swarmCtrl.eng", "swarmCtrl.blk", "swarmCtrl.why",
               "swarmDiagnostics.init"]

      # Health, at a lower rate
      swarm_health:
        frequency: 1
        vars: ["tdoaEngine.stRx", "tdoa3.hmSeqOk", "tdoa3.hmEst",
               "swarmDiagnostics.nis", "swarmDiagnostics.nAcc",
               "swarmDiagnostics.nRej"]
      
      # Anchor ranges [m]. 0.0 = no measurement in the last 500 ms.
      swarm_anchors:
        frequency: 10
        vars: ["tdoa3.hmD0", "tdoa3.hmD1", "tdoa3.hmD2",
               "tdoa3.hmD3", "tdoa3.hmD4"]              # 20 bytes

      # Inter-drone chords [m]: leader then follower.
      swarm_chords:
        frequency: 10
        vars: ["tdoa3.hmD5", "tdoa3.hmD6"]              # 8 bytes


  firmware_params:
    commander:
      enHighLevel: 1

    stabilizer:
      estimator: 2    # 1: complementary, 2: kalman
      controller: 1   # 1: PID, 2: mellinger

    # velCtlPid:
    #   vxKp: 17.0
    #   vxKi: 14.0
    #   vxKd: 1.0
    #   vxKFF: 0.0
    #   vyKp: 17.0
    #   vyKi: 14.0
    #   vyKd: 1.0
    #   vyKFF: 0.0
    # posCtlPid:
    #   xKp: 1.2
    #   xKi: 0.05
    #   xKd: 0.1
    #   yKp: 1.2
    #   yKi: 0.05
    #   yKd: 0.1
    #   zKp: 2.0
    #   zKi: 0.70
    #   zKd: 0.1
    # ctrlMel:
    #   mass: 0.040 #mass for crazyflie with box
    #   kp_xy: 0.1
    #   kd_xy: 0.2
    #   ki_xy: 0.005
    # pid_attitude:
    #   pitch_kd: 0.0
    #   pitch_ki: 3.0
    #   pitch_kp: 6.0
    #   roll_kd: 0.0
    #   roll_ki: 3.0
    #   roll_kp: 6.0
    #   yaw_kd: 0.35
    #   yaw_ki: 1.0
    #   yaw_kp: 6.0
    # ring:
    #   effect: 16 # 6: double spinner, 7: solid color, 16: packetRate
    #   solidBlue: 255 # if set to solid color
    #   solidGreen: 0 # if set to solid color
    #   solidRed: 0 # if set to solid color
    #   headlightEnable: 0

    locSrv:
      extPosStdDev: 1e-3
      extQuatStdDev: 0.5e-1
    
    # Parameters for the Swarm module
    loco:
      mode: 3              # 1 = TWR, 3 = TDoA3 (required for hybrid mode)
      
    tdoa3:
      hmTwr: 1
      hmTwrEstPos: 1
      hmTdoa: 0            # Undertermined on 3 anchors
      hmTwrTXPos: 0        # keep at 0 -- see below
      hmOutTh: 0.12
      hmMaxReply: 0.0
      hmTofAge: 200
      twrStd: 0.05
      hmLId0: 0   # origin
      hmLId1: 1   # x+
      hmLId2: 2   # y+
      hmLId3: 3   
      hmLId4: 4
      # stddev: 0.1        # TDoA noise

    kalman:
      robustTwr: 1

    # --- trajectory -------------------------------------------------------
    # Coefficients come from tools/swarm/fit_elevation.py
    # Saddle
    # swarmCurve:
    #   cx: 0.0              # encirclement centre X [m]
    #   cy: 0.0              # encirclement centre Y [m]
    #   cz: 1.0              # centre altitude above the anchor plane [m], > 0
    #   K: 2                 # harmonic order in use, 0..4 (0 = flat circle)
    #   b0: 0.000073         # elevation profile, constant term [rad]
    #   a1: 0.0              # cos(theta)   [rad]
    #   b1: 0.000408         # sin(theta)   [rad]
    #   a2: -0.349015        # cos(2 theta) [rad]
    #   b2: 0.0              # sin(2 theta) [rad]
    #   a3: 0.0              # cos(3 theta) [rad]
    #   b3: 0.0              # sin(3 theta) [rad]
    #   a4: 0.0              # cos(4 theta) [rad]
    #   b4: 0.0              # sin(4 theta) [rad]

    # Three-lobed crown
    # swarmCurve:
    #   cx: 0.0              # encirclement centre X [m]
    #   cy: 0.0              # encirclement centre Y [m]
    #   cz: 1.0              # centre altitude above the anchor plane [m], > 0
    #   K: 3                 # harmonic order in use, 0..4 (0 = flat circle)
    #   b0: 0.0              # elevation profile, constant term [rad]
    #   a1: -0.000093        # cos(theta)   [rad]
    #   b1: 0.0              # sin(theta)   [rad]
    #   a2: 0.0              # cos(2 theta) [rad]
    #   b2: 0.0              # sin(2 theta) [rad]
    #   a3: -0.436715        # cos(3 theta) [rad]
    #   b3: 0.0              # sin(3 theta) [rad]
    #   a4: 0.0              # cos(4 theta) [rad]
    #   b4: 0.0              # sin(4 theta) [rad]    

    # Flat circle
    swarmCurve:
      cx: 0.0              # encirclement centre X [m]
      cy: 0.0              # encirclement centre Y [m]
      cz: 1.5              # centre altitude above the anchor plane [m], > 0
      K: 0                 # harmonic order in use, 0..4 (0 = flat circle)
      b0: 0.0              # elevation profile, constant term [rad]
      a1: 0.0              # cos(theta)   [rad]
      b1: 0.0              # sin(theta)   [rad]
      a2: 0.0              # cos(2 theta) [rad]
      b2: 0.0              # sin(2 theta) [rad]
      a3: 0.0              # cos(3 theta) [rad]
      b3: 0.0              # sin(3 theta) [rad]
      a4: 0.0              # cos(4 theta) [rad]
      b4: 0.0              # sin(4 theta) [rad]

    # --- estimator --------------------------------------------------------
    swarmFilter:
      en: 1                # run the filter
      rst: 1               # write 1 to force re-seeding; self-clearing
      n: 3                 # agents in the ring -> nominal spacing 2*pi/n
      wz: 0.0              # commanded angular rate [rad/s]

      sigA: 0.03           # anchor range noise, one sigma [m]
      sigC: 0.03           # chord noise, one sigma [m]
      gate: 25.0           # innovation gate, sigma SQUARED (25 = 5 sigma)

      qTh: 0.001           # process noise, common phase [rad^2/s]
      qD: 0.00001          # process noise, formation errors [rad^2/s] -- keep << qTh
      qW: 0.0001           # process noise, rate error [rad^2/s^3]
      qR: 0.00001          # process noise, radius [m^2/s]

      pTh: 0.25            # initial variance, phase [rad^2]
      pD: 0.50             # initial variance, formation errors [rad^2] -- keep large
      pW: 0.25             # initial variance, rate error [(rad/s)^2]
      pR: 0.09             # initial variance, radius [m^2]

    # --- controller -------------------------------------------------------
    swarmCtrl:                 # NEW group
      en: 0                    # engage from your ROS node after takeoff
      rTgt: 0.60
      wNom: 0.20
      kPhi: 0.0                # gain for phase error (0 for single-drone tests)
      kR: 0.8
      vMaxT: 0.35
      vMaxR: 0.25
      rampS: 3.0
      sigTh: 15.0
      sigR: 0.25
      needC: 0                 # 0 for single-drone tests (with kPhi: 0)

  reference_frame: "world"
  broadcasts:
    num_repeats: 15 # number of times broadcast commands are repeated
    delay_between_repeats_ms: 1 # delay in milliseconds between individual repeats